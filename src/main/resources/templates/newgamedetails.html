<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <title>New Game Details</title>

    <!-- Bootstrap 5 CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-header">
                    <h1 class="h4 mb-0">Release Details</h1>
                </div>

                <div class="card-body">

                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label" for="name">
                            Name
                        </label>

                        <input
                                class="form-control"
                                id="name"
                                readonly
                                th:value="${igdbGame.name}"
                                type="text">
                    </div>

                    <!-- Summary -->
                    <div class="mb-3">
                        <label class="form-label" for="summary">
                            Summary
                        </label>

                        <textarea
                                class="form-control"
                                id="summary"
                                readonly
                                rows="5"
                                th:text="${igdbGame.summary}"></textarea>
                    </div>

                    <!-- Release Date -->
                    <div class="mb-3">
                        <label class="form-label" for="releaseDate">
                            Release Date
                        </label>

                        <input
                                class="form-control"
                                id="releaseDate"
                                readonly
                                th:value="${igdbGame.firstReleaseDate}"
                                type="date">
                    </div>

                    <!-- Platforms -->
                    <fieldset class="mb-4">
                        <legend class="form-label">
                            Platforms
                        </legend>

                        <div
                                class="d-flex flex-wrap gap-2"
                                th:if="${platforms != null and not #lists.isEmpty(platforms)}">

                            <span
                                    class="badge text-bg-primary"
                                    th:each="platform : ${platforms}"
                                    th:text="${platform.abbreviation}">
                                Platform
                            </span>
                        </div>

                        <div
                                class="text-muted"
                                th:if="${platforms == null or #lists.isEmpty(platforms)}">
                            No platforms found
                        </div>
                    </fieldset>

                    <!-- Buttons and submission form -->
                    <div class="d-flex justify-content-end gap-2">

                        <button
                                class="btn btn-secondary"
                                onclick="history.back()"
                                type="button">
                            Cancel
                        </button>

                        <form
                                class="d-flex"
                                method="POST"
                                th:action="@{/savegame}">

                            <!-- CSRF token -->
                            <input
                                    th:name="${_csrf.parameterName}"
                                    th:value="${_csrf.token}"
                                    type="hidden">

                            <!-- Game fields -->
                            <input
                                    name="id"
                                    th:value="${igdbGame.id}"
                                    type="hidden">

                            <input
                                    name="name"
                                    th:value="${igdbGame.name}"
                                    type="hidden">

                            <input
                                    name="summary"
                                    th:value="${igdbGame.summary}"
                                    type="hidden">

                            <input
                                    name="firstReleaseDate"
                                    th:value="${igdbGame.firstReleaseDate}"
                                    type="hidden">

                            <input
                                    name="totalRating"
                                    th:value="${igdbGame.totalRating}"
                                    type="hidden">

                            <input
                                    name="cover"
                                    th:value="${igdbGame.cover}"
                                    type="hidden">

                            <input
                                    name="gameStatus"
                                    th:value="${igdbGame.gameStatus}"
                                    type="hidden">

                            <input
                                    name="url"
                                    th:value="${igdbGame.url}"
                                    type="hidden">

                            <input
                                    name="gameType"
                                    th:value="${igdbGame.gameType}"
                                    type="hidden">

                            <!-- Submit one platform ID for each platform -->
                            <th:block
                                    th:if="${platforms != null}"
                                    th:each="platform : ${platforms}">

                                <input
                                        name="platformIds"
                                        th:value="${platform.id}"
                                        type="hidden">
                            </th:block>

                            <button
                                    class="btn btn-primary ms-2"
                                    type="submit">
                                SAVE
                            </button>
                        </form>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap 5 JavaScript Bundle -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
