<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <title>Game details</title>

    <!-- Bootstrap 5 CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-header">
                    <h1 class="h4 mb-0">Release Details</h1>
                </div>

                <div class="card-body">

                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label" for="name">
                            Name
                        </label>

                        <input
                                class="form-control"
                                id="name"
                                readonly
                                th:field="${game.name}"
                                type="text">
                    </div>

                    <!-- Summary -->
                    <div class="mb-3">
                        <label class="form-label" for="summary">
                            Summary
                        </label>

                        <textarea
                                class="form-control"
                                id="summary"
                                readonly
                                rows="5"
                                th:field="${game.summary}"></textarea>
                    </div>

                    <!-- Release Date -->
                    <div class="mb-3">
                        <label class="form-label" for="firstReleaseDate">
                            Release Date
                        </label>
                        <input
                                class="form-control"
                                id="firstReleaseDate"
                                readonly
                                th:value="${#dates.format(firstReleaseDate, 'yyyy-MM-dd')}"
                                type="date">
                    </div>

                    <!-- URL -->
                    <div class="mb-3">
                        <a th:href="${game.url}" th:text="${game.url}" id="url" target="_blank">Link</a>
                    </div>

                    <!-- Rating -->
                    <div class="mb-3">
                        <label class="form-label" for="rating">
                            Rating
                        </label>

                        <input
                                class="form-control"
                                id="rating"
                                readonly
                                th:value="${#numbers.formatDecimal(game.rating, 1,2)}"
                                type="text">
                    </div>

                    <!-- Release Status -->
                    <div class="mb-3">
                        <label class="form-label" for="releaseStatus">
                            Release Status
                        </label>

                        <input
                                class="form-control"
                                id="releaseStatus"
                                readonly
                                th:field="${game.releaseStatus}"
                                type="text">
                    </div>

                    <!-- Game type -->
                    <div class="mb-3">
                        <label class="form-label" for="gameType">
                            Game type
                        </label>

                        <input
                                class="form-control"
                                id="gameType"
                                readonly
                                th:field="${game.gameType}"
                                type="text">
                    </div>

                    <!-- Platforms -->
                    <fieldset class="mb-4">
                        <legend class="form-label">
                            Platforms
                        </legend>

                        <div
                                class="d-flex flex-wrap gap-2"
                                th:if="${game.platforms != null and not #lists.isEmpty(game.platforms)}">

                            <span
                                    class="badge text-bg-primary"
                                    th:each="p : ${game.platforms}"
                                    th:text="${p.abbreviation}">
                                Platform
                            </span>
                        </div>

                        <div
                                class="text-muted"
                                th:if="${game.platforms == null or #lists.isEmpty(game.platforms)}">
                            No platforms found
                        </div>
                    </fieldset>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-end gap-2">
                        <button
                                class="btn btn-secondary"
                                onclick="history.back()"
                                type="button">
                            Close
                        </button>
                        <button
                                class="btn btn-primary"
                                type="button">
                            View Lobbies
                        </button>
                        <button
                                class="btn btn-success"
                                type="button">
                            Create lobby
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap 5 JavaScript Bundle -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
