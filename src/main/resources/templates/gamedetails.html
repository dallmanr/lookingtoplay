<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Release Details</title>

    <!-- Bootstrap 5 CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-header">
                    <h1 class="h4 mb-0">Release Details</h1>
                </div>

                <div class="card-body">
                    <form
                            th:object="${igdbResponse}"
                            th:action="@{/releases/save}"
                            method="post">

                        <!-- Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Name
                            </label>

                            <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    th:field="*{name}"
                                    readonly>
                        </div>

                        <!-- Summary -->
                        <div class="mb-3">
                            <label for="summary" class="form-label">
                                Summary
                            </label>

                            <textarea
                                    id="summary"
                                    class="form-control"
                                    rows="5"
                                    th:field="*{summary}"
                                    readonly></textarea>
                        </div>

                        <!-- Release Date -->
                        <div class="mb-3">
                            <label for="releaseDate" class="form-label">
                                Release Date
                            </label>

                            <input
                                    type="date"
                                    id="releaseDate"
                                    class="form-control"
                                    th:field="*{firstReleaseDate}"
                                    readonly>
                        </div>

                        <!-- Platforms -->
                        <fieldset class="mb-4">
                            <legend class="form-label">
                                Platforms
                            </legend>

                            <div
                                    class="form-check"
                                    th:each="platform : ${igdbResponse.platforms}">

                                <!-- Display-only checkbox -->
                                <input
                                        type="checkbox"
                                        class="form-check-input"
                                        th:id="${'platform-' + platform}"
                                        th:value="${platform}"
                                        checked
                                        disabled>

                                <label
                                        class="form-check-label"
                                        th:for="${'platform-' + platform}"
                                        th:text="${platform}">
                                    Platform
                                </label>

                                <!-- Hidden field submits the value -->
                                <input
                                        type="hidden"
                                        name="platforms"
                                        th:value="${platform}">
                            </div>

                            <!-- Shown if no platforms are available -->
                            <div
                                    class="text-muted"
                                    th:if="${#lists.isEmpty(igdbResponse.platforms)}">
                                No platforms available.
                            </div>
                        </fieldset>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-end gap-2">
                            <button
                                    type="button"
                                    class="btn btn-secondary"
                                    onclick="history.back()">
                                Cancel
                            </button>

                            <button
                                    type="submit"
                                    class="btn btn-primary">
                                Save
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap 5 JavaScript Bundle -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
