<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <title>Game details</title>

    <!-- Bootstrap 5 CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-header">
                    <h1 class="h4 mb-0">Release Details</h1>
                </div>

                <div class="card-body">

                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label" for="name">
                            Name
                        </label>

                        <input
                                class="form-control"
                                id="name"
                                readonly
                                th:field="${game.name}"
                                type="text">
                    </div>

                    <!-- Summary -->
                    <div class="mb-3">
                        <label class="form-label" for="summary">
                            Summary
                        </label>

                        <textarea
                                class="form-control"
                                id="summary"
                                readonly
                                rows="5"
                                th:field="${game.summary}"></textarea>
                    </div>

                    <!-- Release Date -->
                    <div class="mb-3">
                        <label class="form-label" for="releaseDate">
                            Release Date
                        </label>

                        <input
                                class="form-control"
                                id="releaseDate"
                                readonly
                                th:field="${game.firstReleaseDate}"
                                type="date">
                    </div>

                    <!-- Platforms -->
                    <fieldset class="mb-4">
                        <legend class="form-label">
                            Platforms
                        </legend>

                        <div
                                class="form-check"
                                th:each="platform : ${game.platforms}">

                            <!-- Display-only checkbox -->
                            <input
                                    checked
                                    class="form-check-input"
                                    disabled
                                    th:id="${'platform-' + platform}"
                                    th:value="${platform}"
                                    type="checkbox">

                            <label
                                    class="form-check-label"
                                    th:for="${'platform-' + platform}"
                                    th:text="${platform}">
                                Platform
                            </label>

                            <!-- Hidden field submits the value -->
                            <input
                                    name="platforms"
                                    th:value="${platform}"
                                    type="hidden">
                        </div>

                        <!-- Shown if no platforms are available -->
                        <div
                                class="text-muted"
                                th:if="${#lists.isEmpty(game.platforms)}">
                            No platforms available.
                        </div>
                    </fieldset>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-end gap-2">
                        <button
                                class="btn btn-secondary"
                                onclick="history.back()"
                                type="button">
                            Cancel
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap 5 JavaScript Bundle -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
